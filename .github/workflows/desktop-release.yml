# Packages the desktop client for all three platforms and publishes a GitHub
# release. Counterpart to desktop-build.yml, which only runs the smoke test on
# pull requests.
#
# Triggered by pushing a version tag (v*, e.g. v1.0.0); the tag name is the
# version. Manual dispatch is also supported and always produces a draft, since a
# manual run is either a check that packaging still works or an ad-hoc build, and
# neither should appear as a public release without review.
#
# Signing: artifacts are unsigned. On macOS an electron-builder afterPack hook
# applies an ad-hoc signature. This is not optional — repackaging invalidates the
# signature the prebuilt Electron binary ships with, and the Apple Silicon kernel
# refuses to execute a binary without a valid one, so users would see "damaged".
# An ad-hoc signature only makes the bundle launchable; it is not notarization,
# and first launch still requires clearing Gatekeeper as described in the notes.
#
# Release notes are the fixed install and first-run guidance in this file followed
# by a changelog GitHub generates from the pull requests merged since the previous
# release. Nothing per-version is maintained by hand.
#
# macOS ships a single universal build so users need not identify their chip.
# @electron/universal requires every non-binary file to be byte-identical across
# the two architectures before it will merge them, so the afterPack hook skips the
# *-temp directories and signs only the merged bundle; signing each architecture
# separately leaves _CodeSignature/CodeResources differing and the merge aborts.
name: desktop-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build, e.g. v0.2.0"
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos
            args: --mac --universal
            # Where electron-builder leaves the unpacked resources dir, used by
            # the bundled-backend smoke below.
            resources: mac-universal/Polaris.app/Contents/Resources
          - os: windows-latest
            name: windows
            args: --win --x64
            resources: win-unpacked/resources
          - os: ubuntu-latest
            name: linux
            args: --linux --x64
            resources: linux-unpacked/resources
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # packageManager in the root package.json pins the pnpm version for corepack.
      - name: Enable pnpm
        run: corepack enable
        shell: bash

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # electron-builder takes the version from package.json, so stamp it from the
      # tag rather than shipping installers permanently named after the checked-in
      # version.
      - name: Stamp version
        shell: bash
        run: |
          npm --prefix src/desktop version "${{ steps.meta.outputs.version }}" \
            --no-git-tag-version --allow-same-version

      - name: Install workspace dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # See desktop-build.yml: the shell's typecheck/build needs the vendored
      # runtime's declaration output, not its raw TypeScript sources.
      - name: Build vendored type declarations
        shell: bash
        run: pnpm run vendor:types

      - name: Build renderer
        shell: bash
        run: pnpm --dir src/frontend run build

      - name: Build shell
        shell: bash
        run: pnpm --dir src/desktop run build

      # Gate packaging on the smoke test so a bundle that cannot load is never
      # published. The renderer behaves identically across platforms, so running it
      # once on Linux is sufficient.
      - name: Smoke test (Linux only)
        if: matrix.name == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgtk-3-0 libasound2t64 || \
          sudo apt-get install -y xvfb libnss3 libgtk-3-0 libasound2
          # Electron >= 42 downloads its binary on first run, not at install
          # time; fetch it before fixing the sandbox helper's permissions.
          pnpm --dir src/desktop exec install-electron
          # Electron aborts unless chrome-sandbox is setuid root; see desktop-build.yml
          sudo chown root:root src/desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 src/desktop/node_modules/electron/dist/chrome-sandbox
          cd src/desktop && xvfb-run -a pnpm run smoke

      # Downloads the pinned uv binary and copies the backend sources into
      # src/desktop/resources/, which electron-builder ships as extraResources.
      # The packaged app bootstraps a Python environment from them on first
      # launch (#607); see src/desktop/src/main/engine-bootstrap.ts.
      # Staging also computes the backend content hash (resources/backend/.hash)
      # and stamps the engine's version from the tag (app/_release.py), so it
      # runs before the renderer bundle is packaged: the bundle's name carries
      # that hash.
      - name: Stage bundled engine resources
        shell: bash
        run: pnpm --dir src/desktop run stage:resources

      # Each platform records the backend hash it computed. The release job
      # compares them: the renderer bundle is built on Linux but applied on all
      # three platforms, so it is only publishable if they agree.
      - name: Record backend hash
        shell: bash
        run: |
          mkdir -p src/desktop/release
          cp src/desktop/resources/backend/.hash "src/desktop/release/backend-hash-${{ matrix.name }}.txt"
          cat "src/desktop/release/backend-hash-${{ matrix.name }}.txt"

      # The renderer ships separately so a release that changes only the
      # interface can be applied without reinstalling: the client swaps this
      # bundle in and reloads. Two things in the filename tell a client whether
      # it may do that — see src/desktop/src/main/updates/engine-compat.ts:
      #   c<N>     the IPC contract version (is the installed shell new enough?)
      #   b<hash>  the backend hash this interface was built against (is the
      #            installed Python engine the same one?)
      # Without the second, an older install would take the new interface, keep
      # its old engine, report the new version and never be offered the
      # installer. Shells from before this scheme do not recognise the new
      # filename and fall back to the installer, which is what they need.
      # Built once, on Linux, since the bundle is platform-independent.
      - name: Package renderer update
        if: matrix.name == 'linux'
        shell: bash
        run: |
          CONTRACT=$(grep -oE 'CONTRACT_VERSION = [0-9]+' src/desktop/src/shared/contract.ts | grep -oE '[0-9]+')
          VERSION="${{ steps.meta.outputs.version }}"
          BACKEND_HASH=$(tr -d '[:space:]' < src/desktop/resources/backend/.hash)
          test -n "$BACKEND_HASH"
          echo "{\"version\":\"$VERSION\",\"contract\":$CONTRACT,\"backendHash\":\"$BACKEND_HASH\"}" > src/frontend/dist/meta.json
          mkdir -p src/desktop/release
          tar -czf "src/desktop/release/renderer-$VERSION-c$CONTRACT-b${BACKEND_HASH:0:16}.tar.gz" -C src/frontend/dist .

      - name: Package
        shell: bash
        working-directory: src/desktop
        run: npx electron-builder ${{ matrix.args }} --publish never

      # Proves the bundled uv + backend resources inside the packaged output can
      # bootstrap a working engine (managed Python install, venv, dependency
      # install, alembic migrations, /api/health 200) with no system Python —
      # the exact first-launch code path of the packaged app. The smoke drives
      # the bootstrap module directly with node against the unpacked resources
      # rather than launching the packaged Electron app headless: a GUI launch
      # fails differently on every runner (Gatekeeper on macOS, no xvfb
      # equivalent on Windows, SUID sandbox on Linux), while everything this
      # step adds lives below Electron; the Electron shell itself is already
      # covered by the Linux smoke test above.
      - name: Bundled backend smoke
        shell: bash
        run: |
          node src/desktop/dist/bootstrap-smoke.cjs \
            --resources "src/desktop/release/${{ matrix.resources }}" \
            --data "${RUNNER_TEMP}/polaris-engine-smoke"

      # Collect installers only; release/ also holds *-unpacked directories and
      # .blockmap files that need not be uploaded.
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src/desktop/release/*.dmg
            src/desktop/release/*.zip
            src/desktop/release/*.exe
            src/desktop/release/*.AppImage
            src/desktop/release/*.deb
            src/desktop/release/renderer-*.tar.gz
            src/desktop/release/backend-hash-*.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      # The renderer bundle declares the backend hash computed on Linux. If the
      # macOS or Windows build computed a different one, clients on that platform
      # would (correctly) refuse the bundle — but so that nobody has to wonder
      # why, drop it from the release and say so: every platform then updates
      # through its installer. The hash files themselves are not release assets.
      - name: Check the backend hash agrees across platforms
        run: |
          cat dist/backend-hash-*.txt
          if [ "$(cat dist/backend-hash-*.txt | tr -d '[:blank:]' | sort -u | grep -c .)" != "1" ]; then
            echo "::warning::Backend hash differs between platforms; publishing without the renderer bundle (installer-only update)."
            rm -f dist/renderer-*.tar.gz
          fi
          rm -f dist/backend-hash-*.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist
          cat > notes.md <<'EOF'
          ## Install

          | Platform | Download |
          |---|---|
          | macOS (Intel and Apple Silicon) | `*-universal.dmg` or `*-universal-mac.zip` |
          | Windows | `*.exe` (installer) or `*-win.zip` (portable) |
          | Linux | `*.AppImage` or `*.deb` |

          These builds are **neither signed nor notarized**, so each platform needs to be
          told once that the app is safe to run:

          - **macOS**: open the app once (macOS refuses), then go to System Settings →
            Privacy & Security, scroll to Security and choose **Open Anyway**. On
            macOS 15 and later this is the only route in the interface: right-click →
            Open no longer works for apps that are not notarized. From Terminal,
            `xattr -dr com.apple.quarantine /Applications/Polaris.app` does the same.
            The zip carries one less layer of quarantine propagation than the dmg.
          - **Windows**: SmartScreen will block it — choose More info → Run anyway, or use
            the portable zip instead.
          - **Linux**: AppImage needs `libnss3 libgtk-3-0 libasound2` on the host. Under
            Ubuntu 24.04+ AppArmor restrictions, or without a SUID `chrome-sandbox`, start
            it with `--no-sandbox`.

          ## First run

          The first launch sets up the local engine on this computer: it downloads a
          Python toolchain and dependencies, which can take a few minutes. Later launches
          skip this. Everything stays on your machine — there is no server address to
          enter and no account to create.
          EOF
          DRAFT=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRAFT="--draft"
          fi
          # notes.md is prepended to the changelog GitHub derives from the pull
          # requests merged since the previous release, so the install guidance
          # stays fixed while the per-version content maintains itself.
          gh release create "${{ steps.meta.outputs.tag }}" $DRAFT \
            --title "Polaris ${{ steps.meta.outputs.tag }}" \
            --notes-file notes.md \
            --generate-notes \
            dist/*
