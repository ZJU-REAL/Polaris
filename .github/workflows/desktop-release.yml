# 桌面端发版：三平台出包并建 GitHub Release。
# 与 desktop-build.yml 分工：那个在 PR 上只跑 smoke 做回归检查，本文件负责发版。
#
# 触发：push 版本 tag（v*，如 v1.0.0）时自动发版，tag 名即版本号；也可手动触发。
#
# 关于签名：**产物一律未签名**。macOS 侧由 electron-builder 的 afterPack 钩子补一个
# ad-hoc 签名——不是锦上添花：electron-builder 改包会让 Electron 自带签名失效，
# Apple Silicon 内核拒绝执行无有效签名的二进制，用户会看到「已损坏」。ad-hoc 只保证
# 能启动，不等于公证（notarization），首次打开仍需绕 Gatekeeper，见 release 正文。
#
# macOS 出 universal 单包（Intel + Apple Silicon 通吃），用户不必分辨自己的芯片。
# 注意 @electron/universal 要求两个架构的非二进制文件逐字节相同才能 lipo 合并，
# 所以 afterPack 钩子跳过 *-temp 目录、只给合并后的产物签名——逐架构签名会让
# _CodeSignature/CodeResources 不一致，合并会直接报错。
name: desktop-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "手动发版时的版本号（如 v0.2.0）"
        required: true

# 手动触发一律发 draft：手动跑要么是验证三平台出包、要么是临时构建，
# 都该先过目再公开。只有 push v* tag 才直接发布。

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos
            args: --mac --universal
          - os: windows-latest
            name: windows
            args: --win --x64
          - os: ubuntu-latest
            name: linux
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            src/frontend/package-lock.json
            src/desktop/package-lock.json

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # 让安装包文件名带上真实版本号（electron-builder 读 package.json 的 version）
      - name: Stamp version
        shell: bash
        run: |
          npm --prefix src/desktop version "${{ steps.meta.outputs.version }}" \
            --no-git-tag-version --allow-same-version

      - name: Build renderer
        shell: bash
        run: |
          npm ci --prefix src/frontend
          npm run build --prefix src/frontend

      - name: Build shell
        shell: bash
        run: |
          npm ci --prefix src/desktop
          npm run build --prefix src/desktop

      # 发版前先验一遍，避免把加载不起来的包发出去（Linux 侧代表全平台的 renderer 行为）
      - name: Smoke (linux only)
        if: matrix.name == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgtk-3-0 libasound2t64 || \
          sudo apt-get install -y xvfb libnss3 libgtk-3-0 libasound2
          # chrome-sandbox 必须 setuid root，否则 Electron FATAL 中止
          sudo chown root:root src/desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 src/desktop/node_modules/electron/dist/chrome-sandbox
          cd src/desktop && xvfb-run -a npm run smoke

      - name: Package
        shell: bash
        working-directory: src/desktop
        run: npx electron-builder ${{ matrix.args }} --publish never

      # 只收安装包本身：release/ 下还有 *-unpacked 目录与 .blockmap，不必上传
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src/desktop/release/*.dmg
            src/desktop/release/*.zip
            src/desktop/release/*.exe
            src/desktop/release/*.AppImage
            src/desktop/release/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist
          cat > notes.md <<'EOF'
          ## Install

          | Platform | Download |
          |---|---|
          | macOS (Intel and Apple Silicon) | `*-universal.dmg` or `*-universal-mac.zip` |
          | Windows | `*.exe` (installer) or `*-win.zip` (portable) |
          | Linux | `*.AppImage` or `*.deb` |

          These builds are **neither signed nor notarized**, so each platform needs to be
          told once that the app is safe to run:

          - **macOS**: `xattr -dr com.apple.quarantine /Applications/Polaris.app`, or
            right-click → Open → Open anyway. The zip carries one less layer of quarantine
            propagation than the dmg.
          - **Windows**: SmartScreen will block it — choose More info → Run anyway, or use
            the portable zip instead.
          - **Linux**: AppImage needs `libnss3 libgtk-3-0 libasound2` on the host. Under
            Ubuntu 24.04+ AppArmor restrictions, or without a SUID `chrome-sandbox`, start
            it with `--no-sandbox`.

          ## First run

          The app asks for your lab's Polaris server address and validates it against
          `/api/health`. You can change it later from the Server… menu item (Cmd+,).

          **The server must be running a backend that whitelists the desktop origin**, or
          login will fail. The desktop page is served from `app://polaris`, so every
          request is cross-origin, and older backends reject the preflight in production
          mode.
          EOF
          DRAFT=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRAFT="--draft"
          fi
          gh release create "${{ steps.meta.outputs.tag }}" $DRAFT \
            --title "Polaris ${{ steps.meta.outputs.tag }}" \
            --notes-file notes.md \
            dist/*
