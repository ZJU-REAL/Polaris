# Workspace-level Node checks: the vendored cordis runtime contract test,
# kernel lint/tests, and the frontend vitest suite (#728).
# Desktop/frontend build coverage lives in desktop-build.yml.
name: node-ci

on:
  pull_request:
    paths:
      - "vendor/**"
      - "src/kernel/**"
      - "src/frontend/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/node-ci.yml"
  # Commits also land on main directly, so the same checks run after every push there.
  push:
    branches: [main]
    paths:
      - "vendor/**"
      - "src/kernel/**"
      - "src/frontend/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/node-ci.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # packageManager in the root package.json pins the pnpm version for corepack.
      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build vendored type declarations
        run: pnpm run vendor:types

      - name: Vendored runtime contract test
        run: pnpm --dir vendor/contract-smoke run test

      - name: Frontend unit tests (vitest)
        run: pnpm --dir src/frontend test

      - name: Kernel checks
        run: |
          pnpm --dir src/kernel --if-present run lint
          pnpm --dir src/kernel --if-present run test
