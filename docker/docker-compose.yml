name: polaris

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-polaris}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # image 兼作构建 tag 与拉取来源：`build` 时打成此名，`docker compose pull` 时从此拉。
    image: ${POLARIS_IMAGE_PREFIX:-tricktreat}/polaris-api:${POLARIS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file: ../.env
    environment:
      POLARIS_DATA_DIR: /srv/data   # PDF/产物写挂载卷，勿写进代码树（会触发 --watch 重载）
      # 插件内核（#754）：api 是唯一被允许调它的人，密钥两边同一个
      POLARIS_KERNEL_URL: http://kernel:8770
      POLARIS_KERNEL_TOKEN: ${POLARIS_KERNEL_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${POLARIS_API_PORT:-8000}:8000"
    extra_hosts:
      # External model APIs deployed on this host remain separate Compose projects.
      - "host.docker.internal:host-gateway"
    volumes:
      - appdata:/srv/data          # PDF / 编译产物等
      - tectonic-cache:/root/.cache/Tectonic   # tectonic 宏包缓存（首次编译联网下载）

  worker:
    image: ${POLARIS_IMAGE_PREFIX:-tricktreat}/polaris-worker:${POLARIS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    env_file: ../.env
    environment:
      POLARIS_DATA_DIR: /srv/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - appdata:/srv/data
      - tectonic-cache:/root/.cache/Tectonic   # tectonic 宏包缓存（与 api 共享）

  # 插件内核宿主（#754）。**刻意不发布端口**：它只认共享密钥、不做用户认证，
  # 认证在 api 那侧用 owner 守卫做（见 app/api/plugins.py）。端口一旦对外，
  # 拿到密钥就等于拿到在服务端装插件的权限。
  kernel:
    image: ${POLARIS_IMAGE_PREFIX:-tricktreat}/polaris-kernel:${POLARIS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.kernel
    restart: unless-stopped
    environment:
      POLARIS_KERNEL_TOKEN: ${POLARIS_KERNEL_TOKEN:?set POLARIS_KERNEL_TOKEN in .env}
    volumes:
      - kerneldata:/srv/data

  frontend:
    image: ${POLARIS_IMAGE_PREFIX:-tricktreat}/polaris-frontend:${POLARIS_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${POLARIS_FRONTEND_PORT:-8080}:80"

volumes:
  pgdata:
  redisdata:
  appdata:
  kerneldata:
  tectonic-cache:
