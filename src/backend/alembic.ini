[alembic]
script_location = alembic
prepend_sys_path = .
# URL left empty: env.py reads it from app settings (POLARIS_DATABASE_URL).
# ASCII only in this file: alembic reads it with encoding="locale" (PEP 597),
# which is cp1252 on Windows no matter what PYTHONUTF8 says.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
