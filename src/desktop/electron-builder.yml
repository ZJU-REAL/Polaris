# appId 原先带机构域名，改为中性 id：bundle id 不该带机构痕迹。已装用户升级后
# macOS 会视作新应用（权限/钥匙串重新授权一次），属一次性成本。
appId: com.polaris.desktop
productName: Polaris
copyright: Polaris contributors

directories:
  output: release
  buildResources: build

# 只打主进程/preload 的 esbuild 产物；renderer 走 extraResources 复用
# src/frontend 的既有 vite 构建，桌面端不引入第二套前端构建配置。
files:
  - dist/**
  - package.json

extraResources:
  - from: ../frontend/dist
    to: renderer
  # 内嵌后端（#607）：uv 二进制与后端源码由 stage:resources（scripts/fetch-uv.mjs
  # + scripts/stage-backend.mjs）在打包前整理进 resources/，这里原样进包。
  # 首启引导（下载 Python、装依赖）见 src/main/engine-bootstrap.ts。
  - from: resources/uv
    to: uv
  - from: resources/backend
    to: backend

asar: true

# 深链接：一期 handler 为空，但注册必须现在就在包里，否则二期要全员重装
protocols:
  - name: Polaris
    schemes:
      - polaris

# 打包后补 ad-hoc 签名（仅 macOS）。electron-builder 改包会让 Electron 自带的
# 签名失效，而 Apple Silicon 内核拒绝执行无有效签名的二进制。详见脚本内注释。
afterPack: build/after-pack.cjs

mac:
  category: public.app-category.productivity
  # uv 已在 fetch-uv.mjs 里 lipo 成 fat 二进制、两个分架构包中逐字节相同；
  # @electron/universal 合并时要求这类「相同的 Mach-O」显式列进 x64ArchFiles，
  # 否则按「该 lipo 而没 lipo」处理直接报错中止。
  x64ArchFiles: Contents/Resources/uv/uv
  target:
    # zip 优先：分发时比 dmg 少一层隔离属性传播，未签名场景更省事
    - target: zip
    - target: dmg
  # 不用 Developer ID 签名。注意 identity: null 只是「跳过签名」，不会替你做
  # ad-hoc 签名——那件事由上面的 afterPack 钩子完成。
  identity: null

win:
  target:
    # zip 便携版优先：绕过 SmartScreen 对安装器的检查
    - target: zip
    - target: nsis

linux:
  category: Science
  target:
    - target: AppImage
    # deb 的 maintainer 取自 package.json 的 author，**必须带邮箱**，否则
    # electron-builder 直接报错中止（只打 macOS 时碰不到这条，CI 才会暴露）。
    - target: deb
